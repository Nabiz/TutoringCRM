<mat-card>
  <mat-card-header>
    <mat-card-title>Dodaj lekcję</mat-card-title>
  </mat-card-header>
  <form (ngSubmit)="onSubmit()" #lessonFormRef="ngForm">
    <mat-card-content>
      <mat-form-field>
        <mat-label>Data i godzina</mat-label>
        <input
          matInput
          id="lessonDate"
          name="date"
          type="datetime-local"
          [(ngModel)]="lessonForm.date"
          required
        />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Czas trwania (minuty)</mat-label>
        <input
          matInput
          id="durationInMinutes"
          name="durationInMinutes"
          type="number"
          min="1"
          [(ngModel)]="lessonForm.durationInMinutes"
          required
        />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Tryb</mat-label>
        <mat-select id="lessonMode" name="mode" [(ngModel)]="lessonForm.mode" required>
          <mat-option value="Online">Online</mat-option>
          <mat-option value="AtTutor">U tutora</mat-option>
          <mat-option value="AtStudent">U ucznia</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>ID ucznia</mat-label>
        <input
          matInput
          id="studentId"
          name="studentId"
          type="number"
          min="1"
          [(ngModel)]="lessonForm.studentId"
          required
        />
      </mat-form-field>

      <mat-checkbox name="isPaid" [(ngModel)]="lessonForm.isPaid">Opłacona</mat-checkbox>
    </mat-card-content>
    <mat-card-actions>
      <button matButton="filled" type="submit" [disabled]="!lessonFormRef.form.valid">
        Dodaj lekcję
      </button>
    </mat-card-actions>
  </form>
</mat-card>

<mat-card>
  <mat-card-header>
    <mat-card-title>Lista lekcji</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-lesson-table
      [lessons]="lessons()"
      [showStudentColumn]="true"
      [pendingPaymentIds]="pendingPaymentIds()"
      (paymentConfirmationRequested)="confirmPayment($event)"
      (deleteRequested)="deleteLesson($event)"
    ></app-lesson-table>
  </mat-card-content>
</mat-card>
